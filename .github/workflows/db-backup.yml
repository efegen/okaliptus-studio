name: Nightly DB backup

# Encrypted off-site backup: Railway Postgres -> GPG-encrypted GitHub Actions artifact, nightly + on-demand.
#
# This repo is PUBLIC, so the dump is encrypted with GPG (AES-256) BEFORE upload. Anyone can
# download the artifact, but it is useless without BACKUP_PASSPHRASE. NEVER upload a plain dump here.
#
# One-time setup (you do this):
#   Repo -> Settings -> Secrets and variables -> Actions -> add these repo secrets:
#     DATABASE_URL       the SAME Railway connection string that works locally (public host, not *.railway.internal)
#     BACKUP_PASSPHRASE  a strong random passphrase used to encrypt/decrypt the dump.
#                        STORE IT IN A PASSWORD MANAGER — if lost, ALL backups become unrecoverable.
#
# Restore (when you actually need a backup):
#   1. Download the artifact:  gh run download <run-id> -n okaliptus-backup-<stamp>   (or via the Actions UI)
#   2. Decrypt:  gpg --batch --yes --pinentry-mode loopback --passphrase "<BACKUP_PASSPHRASE>" \
#                  -o okaliptus.dump -d okaliptus-<stamp>.dump.gpg
#   3. Restore:  pg_restore --clean --if-exists --no-owner -d "<TARGET_DATABASE_URL>" okaliptus.dump
#
# NOTE: GitHub only runs scheduled workflows from the DEFAULT branch (main). This file
# must be on main for the nightly cron (and the manual "Run workflow" button) to appear.

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 00:00 Europe/Istanbul
  workflow_dispatch: {} # manual trigger from the Actions tab

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt database (pg_dump 18 via Docker, matches the 18.x server)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Fail loudly (not with a confusing pg_dump socket error) if a secret is missing.
          if [ -z "${DATABASE_URL:-}" ]; then echo "DATABASE_URL secret is empty — set it in repo secrets."; exit 1; fi
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then echo "BACKUP_PASSPHRASE secret is empty — set it in repo secrets."; exit 1; fi
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          FILE="okaliptus-$STAMP.dump"
          # Railway Postgres occasionally drops the connection mid-COPY (a transient server-side
          # restart/blip, first seen 2026-07-18 dumping the large product_images blob table). A
          # single blip must not turn the nightly backup red, so retry the dump before giving up.
          ATTEMPTS=4
          for i in $(seq 1 "$ATTEMPTS"); do
            # -e DATABASE_URL passes the host secret into the container env (not argv/logs).
            if docker run --rm -e DATABASE_URL postgres:18 \
                 sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' > "$FILE"; then
              SIZE=$(stat -c%s "$FILE")
              # Guard against a silent empty/partial dump getting encrypted + uploaded.
              if [ "$SIZE" -ge 1024 ]; then
                echo "Dump OK on attempt $i/$ATTEMPTS: $SIZE bytes"
                break
              fi
              echo "Attempt $i/$ATTEMPTS: dump suspiciously small ($SIZE bytes)."
            else
              echo "Attempt $i/$ATTEMPTS: pg_dump failed (server likely dropped the connection)."
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then echo "All $ATTEMPTS dump attempts failed — aborting."; exit 1; fi
            echo "Retrying in 20s..."
            sleep 20
          done
          # Encrypt with AES-256. Passphrase via stdin (fd 0) so it never lands in argv/process list.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$FILE.gpg" "$FILE"
          rm -f "$FILE" # never keep the plaintext dump around
          echo "Encrypted -> $FILE.gpg ($(stat -c%s "$FILE.gpg") bytes)"

      - name: Verify the encrypted dump can be decrypted and restored
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Round-trip proof: a backup you can't restore is worthless. Decrypt with the SAME
          # passphrase, then have pg_restore read the archive TOC. Fails loudly (so the nightly
          # run goes red) if the passphrase is wrong or the archive is corrupt — we never want a
          # silently-unrestorable artifact to be uploaded below.
          DEC="okaliptus-$STAMP.verify.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            -o "$DEC" -d "okaliptus-$STAMP.dump.gpg"
          # pg_restore --list reads the archive header + table of contents without touching any DB.
          ENTRIES=$(docker run --rm -v "$PWD:/w" postgres:18 pg_restore --list "/w/$DEC" | grep -c ';')
          echo "pg_restore read $ENTRIES TOC entries from the decrypted dump."
          if [ "$ENTRIES" -lt 1 ]; then echo "Decrypted archive has no entries — aborting."; exit 1; fi
          rm -f "$DEC" # drop the plaintext again; only the .gpg gets uploaded
          echo "Verified: backup decrypts and is a readable pg_restore archive."

      - name: Upload encrypted dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: okaliptus-backup-${{ env.STAMP }}
          path: okaliptus-*.dump.gpg
          retention-days: 30 # nightly encrypted dumps kept for 30 days
          if-no-files-found: error
